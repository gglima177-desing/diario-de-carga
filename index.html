<style>

  }
}

select.big{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:600 15px var(--f-body);padding:0 10px}

.row{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- utilitários ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function num(x){var n=parseFloat(String(x==null?'':x).replace(',','.'));return isFinite(n)?n:0}
function p2(n){return (n<10?'0':'')+n}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function hm(){var d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())}
function dt(s){return new Date(s+'T12:00:00')}
function addDays(s,n){var d=dt(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function weekStart(s){var d=dt(s);var w=(d.getDay()+6)%7;return addDays(s,-w)}
var WD=['dom','seg','ter','qua','qui','sex','sáb'];
var WDL=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
var MO=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function fmtShort(s){var d=dt(s);return p2(d.getDate())+'/'+p2(d.getMonth()+1)}
function fmtD(s){var d=dt(s);return WD[d.getDay()]+', '+fmtShort(s)}
function fmtLong(s){var d=dt(s);return WDL[d.getDay()]+', '+d.getDate()+' de '+MO[d.getMonth()]}
function fmtW(v){var n=num(v);return String(Math.round(n*100)/100).replace('.',',')}
function norm(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function slug(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'ex'}
function uid(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function mmss(n){return p2(Math.floor(n/60))+':'+p2(n%60)}
function info(id){return CAT[id]||(S.cfg.custom&&S.cfg.custom[id])||[id,'Peito']}
var CTYPES=['Esteira','Bicicleta','Spinning','Caminhada','Corrida','Esporte','Luta','Outro'];
function cdOf(s){if(!s.cd)s.cd={on:0,min:'',tp:'Esteira',ot:''};return s.cd}
function cardioWeek(ws){var we=addDays(ws,6),m=0,d={};sorted().forEach(function(s){if(s.date>=ws&&s.date<=we&&s.cd&&s.cd.on){m+=num(s.cd.min);d[s.date]=1}});return {min:m,days:Object.keys(d).length}}
function cdText(s){if(!s.cd||!s.cd.on)return '';var c=s.cd;return 'cardio '+(num(c.min)?Math.round(num(c.min))+' min ':'')+c.tp+(c.ot?' ('+c.ot+')':'')}
function dayById(id){if(id==='cardio')return {id:'cardio',n:'Cardio',items:[]};var r=null;Object.keys(PLANS).forEach(function(k){PLANS[k].days.forEach(function(d){if(d.id===id)r=d})});return r}
function key(s){return (s.date||'')+' '+(s.start||'00:00')+' '+s.id}
function sorted(){return Object.keys(S.sessions).map(function(k){return S.sessions[k]}).sort(function(a,b){return key(a)<key(b)?-1:1})}
function validSets(en){return (en&&en.s||[]).filter(function(x){return x.d&&x.t!=='a'&&num(x.r)>0})}
function totalValid(s){var t=0;(s.ord||[]).forEach(function(id){t+=validSets(s.ex[id]).length});return t}
function totalTarget(s){var t=0;(s.ord||[]).forEach(function(id){t+=s.ex[id].t||0});return t}
function dur(s){if(!s.start||!s.end)return '';var a=s.start.split(':'),b=s.end.split(':');var m=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);if(m<0)m+=1440;if(m<1)return '';return Math.floor(m/60)+'h'+p2(m%60)}
function prevFor(id,sess){var all=sorted(),k=key(sess),r=null;for(var i=0;i<all.length;i++){var s=all[i];if(key(s)>=k)break;if(s.ex[id]){var v=validSets(s.ex[id]);if(v.length)r={s:s,sets:v}}}return r}
function bestBefore(id,sess){var all=sorted(),k=key(sess),b=0;for(var i=0;i<all.length;i++){var s=all[i];if(key(s)>=k)break;if(s.ex[id])validSets(s.ex[id]).forEach(function(x){b=Math.max(b,num(x.w))})}return b}

 day.items.forEach(function(it){var i=info(it[0]);s.ord.push(it[0]);s.ex[it[0]]=mkEx(i[0],i[1],it[1])});
 return s}

 var day=dayById(id);var s=null;sorted().forEach(function(x){if(!x.fin&&x.day===id)s=x});
 if(!s){s=newSession(day);S.sessions[s.id]=s;touch(s)}
 enterSession(s.id)}
function nextIdx(P){var last=null;sorted().forEach(function(s){if(s.fin&&P.days.some(function(d){return d.id===s.day}))last=s});if(!last)return 0;var i=0;P.days.forEach(function(d,k){if(d.id===last.day)i=k});return (i+1)%P.days.length}
function groupVolume(ws){var we=addDays(ws,6),m={};sorted().forEach(function(s){if(s.date<ws||s.date>we)return;s.ord.forEach(function(id){var en=s.ex[id],n=validSets(en).length;if(n)m[en.g]=(m[en.g]||0)+n})});return m}

 case 'tstop':stopRest();break;
 case 'wk':S.ev.off=Math.min(0,S.ev.off+(+el.dataset.v));render();break;
 case 'delsess':{var k='ds:'+el.dataset.id;if(S.cf===k){S.cf=null;delete S.sessions[el.dataset.id];Store.del(el.dataset.id)}else S.cf=k;render();break}
 case 'exjson':exportJson();break;
 case 'exbody':exportBodyCsv();break;
 case 'newbody':{var nid='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,4);S.body[nid]={id:nid,date:todayStr(),ts:Date.now(),v:{}};enterBody(nid);break}
 case 'openbody':enterBody(el.dataset.id);break;
 case 'delbody':{var bk='bd:'+el.dataset.id;if(S.cf===bk){S.cf=null;delete S.body[el.dataset.id];Store.del(el.dataset.id);toast('Medição apagada');leaveSession()}else{S.cf=bk;render()}break}
 case 'bcmp':S.bcmp=el.dataset.v;render();break;
 case 'remind':S.cfg.remind=+el.dataset.v;Store.saveCfg();render();break;
 case 'excsv':exportCsv();break;
 }
});
document.addEventListener('input',function(e){
 var el=e.target,f=el.dataset&&el.dataset.f;if(el.id==='sq'){sheetList();return}if(!f)return;
 if(f==='bf'||f==='bdate'){var be=S.body[S.mid];if(!be)return;if(f==='bdate'){if(!el.value)return;be.date=el.value}else{var bk2=el.dataset.k,bx=parseFloat(String(el.value).replace(',','.'));if(isFinite(bx))be.v[bk2]=bx;else delete be.v[bk2]}be.ts=Date.now();Store.saveSession(be.id);return}
 var s=S.sessions[S.sid];if(!s)return;
 if(f==='w'||f==='r'){s.ex[el.dataset.ex].s[+el.dataset.i][f]=el.value;touch(s)}
 else if(f==='note'){s.ex[el.dataset.ex].o=el.value;touch(s)}
 else if(f==='cmin'||f==='cot'){cdOf(s)[f==='cmin'?'min':'ot']=el.value;touch(s)}
 else if(f==='date'||f==='start'||f==='end'){if(f==='date'&&!el.value)return;s[f]=el.value;touch(s)}
});
document.addEventListener('change',function(e){
 var el=e.target,f=el.dataset&&el.dataset.f;if(!f)return;
 if(f==='evsel'){S.ev.ex=el.value;render()}
 else if(f==='bsel'){S.bsel=el.value;render()}
 else if(f==='import'&&el.files&&el.files[0]){importFile(el.files[0]);el.value=''}
});
window.addEventListener('popstate',function(){if(S.sid||S.mid){cleanBody();S.sid=null;S.mid=null;closeSheet();render()}});
document.addEventListener('visibilitychange',function(){if(document.hidden)Store.flush();else if(S.sid)lockScreen()});
window.addEventListener('pagehide',function(){Store.flush()});

/* ---------- início ---------- */
function showUpd(txt,fn){if(document.querySelector('.upd'))return;var b=document.createElement('button');b.type='button';b.className='upd';b.textContent=txt;b.onclick=fn;document.body.appendChild(b)}
function hardRefresh(){try{Store.flush()}catch(e){}
 var jobs=[];if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k!=='dc-fonts'}).map(function(k){return caches.delete(k)}))}));
 if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}));
 Promise.all(jobs).catch(function(){}).then(function(){location.reload()})}
/* Corrige panturrilhas criadas à mão: grupo certo e mesmo exercício do plano (idempotente). */
function migratePant(){
 var CAN={'pant-pe':'Panturrilha em pé','pant-sen':'Panturrilha sentada'},ch=false;
 function kind(n){var q=norm(n);if(q.indexOf('panturrilha')<0)return null;if(q.indexOf('sentad')>=0)return 'pant-sen';return /leg|smith|burro|donkey|unilateral|halter/.test(q)?'x':'pant-pe'}
 var cu=S.cfg.custom||{};Object.keys(cu).forEach(function(id){var k=kind(cu[id][0]);if(!k)return;if(k==='x'){if(cu[id][1]!=='Panturrilha'){cu[id]=[cu[id][0],'Panturrilha'];ch=true}}else{delete cu[id];ch=true}});
 if(ch)Store.saveCfg();
 Object.keys(S.sessions).forEach(function(sid){var s=S.sessions[sid],mod=false;if(!s||!Array.isArray(s.ord)||!s.ex)return;
  s.ord.slice().forEach(function(id,ix){var en=s.ex[id];if(!en)return;var k=kind(en.n);if(!k)return;
   if(k==='x'||CAN[id]){if(en.g!=='Panturrilha'){en.g='Panturrilha';mod=true}if(CAN[id]&&en.n!==CAN[id]){en.n=CAN[id];mod=true}return}
   if(s.ex[k])return;
   en.n=CAN[k];en.g='Panturrilha';s.ex[k]=en;delete s.ex[id];s.ord[ix]=k;mod=true});
  if(mod)Store.saveSession(sid)})}
(async function boot(){
 await Store.init();
 var d=await Store.load();
 S.cfg=Object.assign({program:'p5',custom:{},rest:90,remind:4},d.cfg||{});if(!S.cfg.custom)S.cfg.custom={};
 S.sessions=d.sessions||{};
 S.body=d.body||{};Object.keys(S.body).forEach(function(k){var e=S.body[k];if(!e||!e.v||!Object.keys(e.v).length)delete S.body[k]});
 migratePant();render();
 if(!window.EXI||EXI.v!==10)showUpd('Atualização incompleta. Toque para corrigir',hardRefresh);
 if('serviceWorker' in navigator){
  var hadCtl=!!navigator.serviceWorker.controller,shown=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
   if(!hadCtl||shown)return;shown=true;
   showUpd('Nova versão disponível. Toque para atualizar',function(){Store.flush();location.reload()})});
  navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
})();
</script>
